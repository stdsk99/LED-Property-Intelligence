<script>let idToken="";function serverCall(n,...a){return new Promise((ok,no)=>{const r=google.script.run.withSuccessHandler(ok).withFailureHandler(no);r[n](...a);});}function start(){if(!window.LEDPI_GOOGLE_CLIENT_ID){alert("Missing GOOGLE_OAUTH_CLIENT_ID");return;}google.accounts.id.initialize({client_id:window.LEDPI_GOOGLE_CLIENT_ID,callback:async x=>{idToken=x.credential;try{const d=await serverCall("getBootstrap",idToken);document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("signedIn").textContent="Signed in: "+d.user.email+" ("+d.user.role+")";}catch(e){idToken="";alert(e.message||e);}}});google.accounts.id.renderButton(document.getElementById("googleButton"),{theme:"outline",size:"large",locale:"th"});}window.addEventListener("load",()=>{const t=()=>window.google?.accounts?.id?start():setTimeout(t,300);t();});</script>
