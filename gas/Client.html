<script>let idToken="",properties=[];function serverCall(n,...a){return new Promise((ok,no)=>{const r=google.script.run.withSuccessHandler(ok).withFailureHandler(no);r[n](...a);});}function draw(){const host=document.getElementById("propertyRows");host.innerHTML=properties.length?properties.map(p=>"<div class=\"card\"><b>"+String(p.title||"").replace(/[&<>]/g,"")+"</b><p>"+String(p.province||"")+" · ราคาประเมิน "+(p.government_assessed||"—")+" · ราคาประกาศ "+(p.listing_asking||"—")+"</p></div>").join(""):"<p>ยังไม่มีข้อมูลทรัพย์</p>";}function start(){if(!window.LEDPI_GOOGLE_CLIENT_ID){alert("ผู้ดูแลระบบยังไม่ได้ตั้งค่า GOOGLE_OAUTH_CLIENT_ID");return;}google.accounts.id.initialize({client_id:window.LEDPI_GOOGLE_CLIENT_ID,callback:async x=>{idToken=x.credential;try{const d=await serverCall("getBootstrap",idToken);properties=d.properties||[];document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("signedIn").textContent="เข้าสู่ระบบ: "+d.user.email+" ("+d.user.role+")";draw();}catch(e){idToken="";alert(e.message||e);}}});google.accounts.id.renderButton(document.getElementById("googleButton"),{theme:"outline",size:"large",locale:"th"});}document.getElementById("newProperty").addEventListener("submit",async e=>{e.preventDefault();try{await serverCall("saveProperty",idToken,Object.fromEntries(new FormData(e.target).entries()));properties=await serverCall("listProperties",idToken);draw();e.target.reset();}catch(x){alert(x.message||x);}});window.addEventListener("load",()=>{const t=()=>window.google?.accounts?.id?start():setTimeout(t,300);t();});</script>
