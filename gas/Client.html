<script>let idToken="";function serverCall(n,...a){return new Promise((ok,no)=>{const r=google.script.run.withSuccessHandler(ok).withFailureHandler(no);r[n](...a);});}function start(){google.accounts.id.initialize({client_id:window.LEDPI_GOOGLE_CLIENT_ID,callback:async x=>{idToken=x.credential;try{const d=await serverCall("getBootstrap",idToken);document.body.insertAdjacentHTML("beforeend","<p>Signed in: "+d.user.email+"</p>");}catch(e){alert(e.message||e);}}});google.accounts.id.renderButton(document.body,{theme:"outline",size:"large"});}window.addEventListener("load",()=>{const t=()=>window.google?.accounts?.id?start():setTimeout(t,300);t();});</script>
